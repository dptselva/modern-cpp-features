name: C++ AI Agent PR Creator
on:
  issues:
    types: [labeled] # Triggers when you add a specific label like 'agent-fix'

jobs:
  cpp-agent-fix:
    if: github.event.label.name == 'agent-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master  # <-- FORCES GitHub to cleanly pull your master branch contents

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install grok

      - name: Run AI Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} 
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python .github/scripts/cpp_agent.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "agent: fix issue #${{ github.event.issue.number }}"
          title: "AI Fix for Issue #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          body: |
            This is an automated pull request generated by the AI C++ Agent.
            Fixes #${{ github.event.issue.number }}
          branch: "ai-fix-issue-${{ github.event.issue.number }}"
          base: master # <-- ADD THIS LINE SO IT TARGETS YOUR DEFAULT BRANCH
